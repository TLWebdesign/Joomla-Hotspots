name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=-1, display_errors=On

      # php -l also reports compile-time deprecations (for example implicitly nullable parameters on 8.4).
      - name: Lint
        run: |
          status=0
          while IFS= read -r -d '' file; do
            out=$(php -l "$file" 2>&1) || status=1
            echo "$out" | grep -vE '^No syntax errors' || true
            echo "$out" | grep -qE 'Deprecated|Warning' && status=1
          done < <(find site build -name '*.php' -print0)
          exit $status

  compatibility:
    name: PHPCompatibility 8.1-8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install PHP_CodeSniffer and PHPCompatibility
        run: |
          mkdir -p "$RUNNER_TEMP/phpcs" && cd "$RUNNER_TEMP/phpcs"
          composer init -n --name=ci/phpcs >/dev/null
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require -n --dev squizlabs/php_codesniffer:^4.0 phpcompatibility/php-compatibility:dev-develop dealerdirect/phpcodesniffer-composer-installer

      - name: Scan
        run: "$RUNNER_TEMP/phpcs/vendor/bin/phpcs --standard=PHPCompatibility --runtime-set testVersion 8.1-8.4 --extensions=php -q site build"

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: zip

      - name: Build
        run: php build/build.php

      - uses: actions/upload-artifact@v4
        with:
          name: pkg_hotspots
          path: dist/pkg_hotspots-*.zip
